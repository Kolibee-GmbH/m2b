# Settings for the development tools only; the plugins have no build step and no
# runtime dependencies.

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unreachable = true
