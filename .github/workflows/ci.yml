name: ci

# On main and on pull requests only: a branch is checked through its pull request, and a tag
# points at a commit main has checked already. A newer run for the same ref cancels the older one.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version the README names as the minimum; the manifest and band checks run against it.
  CLAUDE_CODE_VERSION: 2.1.319

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Two jobs cover both Pythons on both systems: on macOS, scripts/check runs the unit tests
        # with the system /usr/bin/python3 (3.9) as well, and Ubuntu runs everything on 3.9.
        # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 for setup-python.
        include:
          - os: macos-latest
            python: "3.x"
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # scripts/ci-scope compares with the commit the change starts from.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # A pull request of a release or a pin changes only the version, the changelog, the eval page
      # or the marketplace; the code it releases was proved by the runs before it. Anything else, a
      # scope that cannot be told, and every run on main run the whole proof: a push may cancel the
      # run of the merge before it, and the tree that is tagged needs one full run that finished.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: echo "scope=$(scripts/ci-scope "$BASE" "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - if: steps.scope.outputs.scope != 'release'
        run: scripts/check
      - if: steps.scope.outputs.scope == 'release'
        run: scripts/check --release
