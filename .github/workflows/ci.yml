name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The version the README names as the minimum; the manifest and band checks run against it.
  CLAUDE_CODE_VERSION: 2.1.319

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 for setup-python.
        os: [macos-latest, ubuntu-24.04]
        python: ["3.9", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: scripts/check
